name: Prüfen

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lua 5.1 installieren
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Syntax prüfen
        run: for f in *.lua Daten/*.lua tests/*.lua; do luac5.1 -p "$f"; done
      - name: Testlauf
        run: lua5.1 tests/simulation.lua
