name: Release

# Ein Tag wie v0.1.0 baut das Paket und lädt es zu CurseForge und Wago hoch.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Testlauf
        run: sudo apt-get update && sudo apt-get install -y lua5.1 && lua5.1 tests/simulation.lua
      - name: Paket bauen und hochladen
        uses: BigWigsMods/packager@v2
